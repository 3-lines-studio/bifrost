name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the module on proxy.golang.org
        run: |
          url="https://proxy.golang.org/github.com/3-lines-studio/bifrost/@v/${{ github.ref_name }}.info"
          for attempt in 1 2 3 4 5 6; do
            if curl -sSf "$url" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1
