name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: Run release checks
        run: make check

      - name: Run renderer benchmarks
        run: make bench

      - name: Verify module on proxy.golang.org
        run: |
          for attempt in 1 2 3 4 5 6; do
            if GOPROXY=proxy.golang.org go list -m github.com/3-lines-studio/bifrost@${{ github.ref_name }}; then
              exit 0
            fi
            sleep 10
          done
          exit 1
